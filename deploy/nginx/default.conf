# One API (aixlab) edge reverse proxy.
#
# Only this container publishes a host port. The app containers are internal to
# the compose network on purpose: c.ClientIP() feeds rate limiting
# (middleware/rate-limit.go) and token subnet enforcement (middleware/auth.go),
# so nothing must be able to reach the app except through here.

# The app containers have fixed addresses on the compose network (see
# docker-compose.yml), so these names resolve once at startup and stay valid
# across container recreation. Runtime DNS re-resolution was deliberately not
# used: Docker's embedded resolver briefly returns NXDOMAIN for a stopped
# container, and nginx then parks requests on the lookup instead of failing
# over (observed as client timeouts). Fixed IPs remove the lookup entirely.
upstream one_api {
    zone one_api 64k;

    # Primary. max_fails=1 keeps failover fast during a rolling rebuild.
    server one-api-a:3000 max_fails=1 fail_timeout=10s;

    # Warm standby: receives traffic only while the primary is marked down.
    # It stays running so failover needs no nginx reload.
    server one-api-b:3000 backup;

    keepalive 32;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Long prompts are large; the API limit is what actually bounds them.
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;

    # Overwrite rather than append. gin trusts every proxy by default and reads
    # the leftmost X-Forwarded-For entry, so $proxy_add_x_forwarded_for would
    # let a client prepend a forged address and defeat the per-token subnet
    # restriction. At the edge, $remote_addr is the real client.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # A local bridge connect is sub-millisecond; 1s only bounds the case where
    # a stopped container's address is no longer routed. Without a short bound
    # the first request after the primary goes away would wait for the OS SYN
    # timeout before proxy_next_upstream could try the standby.
    proxy_connect_timeout 1s;

    # Streaming answers legitimately run for tens of seconds; leave far more
    # headroom than that.
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    # Retry the other app ONLY when the request never reached the app.
    # `error` and `timeout` cover the connect phase: the client's bytes are
    # still queued in nginx, so replaying them is safe. That is exactly what a
    # rolling rebuild produces -- the primary container is removed, its
    # address stops accepting, and the same request is served by the standby.
    # POST is retried in that case even WITHOUT non_idempotent, because nginx
    # only withholds a non-idempotent retry once the request has actually been
    # sent upstream.
    #
    # Deliberately NOT here: non_idempotent, http_502, http_503, http_504.
    # Those retry a request that HAS already been delivered to the app. If the
    # primary dies after accepting a POST -- say, between reading it and
    # writing the response headers -- replaying it on the standby calls the
    # model upstream twice: duplicate provider cost, and two usage_records
    # rows under two different request ids that the per-request idempotency
    # key cannot collapse. A single 502 the client can retry is cheaper than
    # one duplicate paid call.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    # Everything is served by the app: API, relay and the embedded frontend.
    location /api/ {
        proxy_pass http://one_api;
    }

    # Buffering is disabled ONLY here, because only /v1/ streams.
    # common.SetEventStreamHeaders is called exclusively from relay/adaptor/*
    # and those routes all live under /v1/. With buffering on, nginx collects a
    # stream and writes it as one block once the upstream finishes, which
    # breaks incremental delivery entirely. /api/ (admin JSON) and / (embedded
    # frontend assets) keep nginx's default buffering so they are still
    # written out in batches. No gzip anywhere for the same reason.
    location /v1/ {
        proxy_pass http://one_api;
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        proxy_pass http://one_api;
    }
}
